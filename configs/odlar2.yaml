# Odlar-2 (QARALAMA, hələ öyrədilməyib). 109.5M parametr, Llama quruluşu, kontekst 1024.
# Tam plan: "Odlar-2: təlim planı" sənədi.
# Mənbə siyahısı və həcmlər 1-ci mərhələdə (data v1) dəqiqləşir: HPLT, OSCAR (bal >= 2.5), kitablar,
# bloqlar əlavə olunacaq, xəbər domenlərinin siyahısı FineWeb-2-nin URL statistikasından çıxarılacaq.
# Sənəd maskası və WSD pilotda seçildi (results/pilot.md, 28 noyabr).
# Təxmini vaxt (ölçülüb): Kaggle T4x2-də ~24 saat + sənəd maskası ~3 saat; bir T4-də ~41+5 saat.
# Kaggle-da interaktiv sessiya ilə başlat; təlim gedən taba toxunma (results/pilot.md).
#   python -m odlar.data configs/odlar2.yaml                          # Kaggle CPU sessiyası
#   torchrun --standalone --nproc_per_node=2 -m odlar.train configs/odlar2.yaml
name: odlar2
model:
  arch: llama
  block_size: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  rope_theta: 10000.0
data:
  vocab_size: 32000
  tok_train_chars: 1000000000
  split_digits: true          # hər rəqəm ayrıca token
  val_frac: 0.01
  val_max_tokens: 2000000     # hər mənbədən validasiyaya ən çox bu qədər token
  hub_dataset: krmhus/odlar-2-data   # hazır tokenlər (gizli); təlim sessiyası buradan endirir
  sources:                    # sıra önəmlidir: dublikatda əvvəlki mənbə saxlanır
    - type: files
      label: bedii
      glob: books/**/*
      min_chars: 1000
      repeat: 4
      tok_weight: 2
    - type: hf
      label: vikipediya
      path: wikimedia/wikipedia
      name: 20231101.az
      streaming: true
      max_chars: 300000000
      min_chars: 200
      # 0.15 həddi 16 621 məqalədən 72-ni atırdı, çoxu cədvəlli normal məqalə (şəhər, idmançı);
      # 0.25-də 15 qalır (27 noyabr ölçüsü)
      filter: {max_digit: 0.25}
      repeat: 2
      tok_weight: 1.5
    - type: hf
      label: veb
      path: HuggingFaceFW/fineweb-2
      name: azj_Latn
      streaming: true
      max_chars: 2000000000
      min_chars: 300
      # Xəbər saytları ayrı səbətdə, payı max_chars ilə məhdud (plan: <= 20%). 27 noyabr ölçüsü:
      # FineWeb-2-nin ilk 6000 sənədinin ~55%-i bu domenlərdəndir. Siyahı o nümunənin URL
      # statistikasındandır; 1-ci mərhələdə tam data üzrə yoxlanacaq.
      routes:
        - label: xeber
          max_chars: 500000000
          domains: [publika.az, azadliq.org, amerikaninsesi.org, report.az, metbuat.az, azertag.az,
                    azadliq.az, sizinyol.com, trend.az, yenicag.az, 24saat.org, sia.az, habermonitor.com,
                    turaninfo.az, sumqayitxeber.com, fins.az, musavat.az, musavat.com, milli.az,
                    bizimxeber.az, ekspress.az, aznews.az, movqe.az, teleqraf.com, kaspi.az, sputnik.az,
                    oxu.az, apa.az, qafqazinfo.az, axar.az, modern.az, day.az, 1news.az, haqqin.az]
train:
  # 27 noyabr Colab T4 ölçüsü (tools/gpu_probe.py, fp16): batch 8 -> 8.4 GiB, 16.4k token/san;
  # batch 12 -> 11.8 GiB, 16.3k; batch 16 yaddaşa sığmır. Sürət batch 8-də platoya çatır.
  batch_size: 8
  grad_accum: 8          # qlobal: 8 x 8 x 1024 = 65 536 token/addım (2 GPU-da hər biri 4 addım)
  lr: 3.0e-4
  warmup: 1000
  schedule: wsd          # sabit sürət, son 20%-də 1-sqrt ilə 10%-ə enmə; pilotda cosine-dan 0.053-0.055 yaxşı (K4)
  decay_frac: 0.2
  min_lr_frac: 0.1
  max_steps: 33500       # 33 500 x 65 536 = ~2.2 milyard token (Chinchilla: 20 token/parametr)
  doc_mask: true         # pilot (results/pilot.md): val loss -0.046/-0.052 iki toxumda, sürət -11% (K3)
  eval_every: 500
  eval_batches: 20
  hub_every: 1000        # checkpoint ~1.3 GB: hər 1000 addımda Hub-a, tarixçə sıxılır (K7)
  spike_rollback: true
  sample_prompt: Qış gecəsi idi
  hub_repo: krmhus/odlar-2
