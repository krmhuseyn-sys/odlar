# Odlar-2 (QARALAMA, hələ öyrədilməyib). 109.5M parametr, Llama quruluşu, kontekst 1024.
# Tam plan: "Odlar-2: təlim planı" sənədi. Data balansı pilotdan sonra dəqiqləşəcək.
# Təxmini vaxt: Kaggle T4x2-də ~28 saat, bir T4-də ~49 saat (qaldığı yerdən davam edir).
name: odlar2
model:
  arch: llama
  block_size: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  rope_theta: 10000.0
data:
  vocab_size: 32000
  tok_train_chars: 800000000
  val_frac: 0.01
  sources:
    - type: hf
      label: vikipediya
      path: wikimedia/wikipedia
      name: 20231101.az
      max_chars: 300000000
      min_chars: 200
      repeat: 2
    - type: hf
      label: fineweb2
      path: HuggingFaceFW/fineweb-2
      name: azj_Latn
      streaming: true
      max_chars: 2000000000
      min_chars: 300
    - type: files
      label: bedii
      glob: books/**/*.txt
      min_chars: 1000
      repeat: 3
train:
  batch_size: 16
  grad_accum: 4          # effektiv batch 64 x 1024 = 65 536 token/addım (2 GPU-da grad_accum 2)
  lr: 3.0e-4
  warmup: 1000
  max_steps: 33500       # 33 500 x 65 536 = ~2.2 milyard token (Chinchilla: 20 token/parametr)
  eval_every: 500
  eval_batches: 20
  sample_prompt: Qış gecəsi idi
  hub_repo: krmhus/odlar-2
