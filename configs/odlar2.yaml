# Odlar-2 (QARALAMA, hələ öyrədilməyib). 109.5M parametr, Llama quruluşu, kontekst 1024.
# Tam plan: "Odlar-2: təlim planı" sənədi.
# Data v1 (results/data_v1.md, 28 noyabr): qumar spamı, maşın tərcüməli saytlar və kitablarda iki
# sütunun qarışması filtrlənir; OSCAR çıxarılıb. Epoxa ~8.4 mlrd simvol (~1.96 mlrd token), xəbər ~18.5%.
# Sənəd maskası və WSD pilotda seçildi (results/pilot.md, 28 noyabr).
# Təxmini vaxt (ölçülüb): Kaggle T4x2-də ~24 saat + sənəd maskası ~3 saat; bir T4-də ~41+5 saat.
# Kaggle-da interaktiv sessiya ilə başlat; təlim gedən taba toxunma (results/pilot.md).
#   python -m odlar.data configs/odlar2.yaml                          # Kaggle CPU sessiyası
#   torchrun --standalone --nproc_per_node=2 -m odlar.train configs/odlar2.yaml
name: odlar2
model:
  arch: llama
  block_size: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.0
  rope_theta: 10000.0
data:
  vocab_size: 32000
  tok_train_chars: 1000000000
  split_digits: true          # hər rəqəm ayrıca token
  val_frac: 0.01
  val_max_tokens: 2000000     # hər səbətdən validasiyaya ən çox bu qədər token
  hub_dataset: krmhus/odlar-2-data   # hazır tokenlər (gizli); təlim sessiyası buradan endirir
  workers: 4
  # data v1 (28 noyabr): bir epoxada ~8.4 mlrd simvol (~1.96 mlrd token, 4.3 simvol/token); 33 500
  # addım ~1.15 epoxadır. AzTC-full və kitablar tam oxunub, FineWeb-2 nümunədən (results/data_v1.md).
  # Sıra önəmlidir: dublikatda əvvəlki mənbə saxlanır (Vikimənbə -> kitab -> Vikipediya -> AzTC -> veb).
  sources:
    - type: hf                 # Vikimənbə: klassiklər, dastanlar, şeir (30.8M simvol)
      label: bedii_vm
      path: wikimedia/wikisource
      name: 20231201.az
      meta_field: title
      min_chars: 300
      filter: {max_dup_lines: 0.5}   # şeirlərdə nəqarət çox olur
      repeat: 4
      tok_weight: 2
      routes:
        - label: din           # Bibliya tərcüməsi bədii səbətə düşməsin
          meta_regex: "^Bibliya"
          repeat: 1
        - label: vm_diger      # nitqlər, rəsmi sənədlər: bədii deyil
          meta_regex: "Əliyev|Prezident|Konstitusiya|Qanun|Fərman|Sərəncam"
          repeat: 1
    - type: hf_sentences       # 2764 kitab, 1.03 mlrd simvol (CC BY-NC: model qeyri-kommersiya qalır)
      label: kitab
      path: LocalDoc/books_dataset
      text_field: " Sentence"
      group_field: " Metadata"
      doc_chars: 20000
      min_chars: 1000
      # OCR zədəsi: tanınmayan söz payı > 0.12 olan 20k simvolluq parçalar atılır (~8%; results/data_v1.md)
      # İki sütunlu səhifələrin qarışması (results/data_v1.md): 1000 sözə 0.5-dən çox "sütun izi"
      filter: {max_oov: 0.12, max_joints: 0.5}
      repeat: 1
      routes:
        - label: bedii         # bədii ədəbiyyat 47M + folklor 33M simvol
          meta_regex: "Kateqoriya:(Bədii ədəbiyyat|Folklor)"
          repeat: 4
          tok_weight: 2
        - label: kitab_dil     # ədəbiyyatşünaslıq və dilçilik 75M: zəngin dil, sitatlar
          meta_regex: "Kateqoriya:(Ədəbiyyatşünaslıq|Dilçilik)"
          repeat: 2
        - label: kitab_siyasi  # siyasət 227M (o cümlədən nitq topluları): yarısı
          meta_regex: "Kateqoriya:Siyasət|Müəllif:Əliyev (İlham|Heydər)"
          keep_frac: 0.5
    - type: hf
      label: vikipediya
      path: wikimedia/wikipedia
      name: 20231101.az
      streaming: true
      max_chars: 400000000
      # 0.15 həddi 16 621 məqalədən 72-ni atırdı, çoxu cədvəlli normal məqalə (şəhər, idmançı);
      # 0.25-də 15 qalır (27 noyabr ölçüsü)
      filter: {max_digit: 0.25}
      repeat: 2
      tok_weight: 1.5
    - type: hf                 # AzTC-full: 7.5 mlrd simvol, ~80%-i xəbər/mətbuat arxivi
      label: xeber_aztc
      path: LocalDoc/AzTC-full
      streaming: true
      meta_field: source
      drop_meta_regex: "^(books|wikipedia)$"   # kitablar və Vikipediya ayrıca götürülür
      keep_frac: 0.13          # xəbər ~5.5 mlrd simvoldan ~0.7 mlrd (xəbər cəmi <= 20%)
      max_chars: 750000000
      routes:
        - label: qanun         # qanunvericilik 409M: yarısı
          meta_regex: "^legislation$"
          keep_frac: 0.5
        - label: aztc_diger    # mədəniyyət, təhsil, din portalları 247M
          meta_regex: "^(medeniyyet|tehsil|muselmanlar)$"
    - type: hf                 # FineWeb-2 azj: 7.29M sənəd, ~26 mlrd simvol (results/data_v1.md)
      label: veb
      path: HuggingFaceFW/fineweb-2
      name: azj_Latn
      streaming: true
      min_chars: 300
      # Simvol payları (28 noyabr, 12 sətir qrupu, 46k sənəd): xəbər 23%, uzun 57%, qalan 20%.
      # Qumar spamı (DEFAULT_RULES max_gambling): uzunların 80%-i, qalanın 25%-i, xəbərin 7%-i.
      # Xarici saytların maşın tərcüməli "az." alt domenləri (az.xxx.pt, az.xxx.com): qalanın 13%-i.
      drop_domain_regex: "^az\\.(?!armradio\\.am$|ambafrance\\.org$)[^.]+\\.(?!az$)[a-z.]+$"
      keep_frac: 1.0           # spamsız qalan ~3 mlrd simvolun hamısı
      max_chars: 3500000000
      routes:
        - label: xeber
          keep_frac: 0.15      # ~6 mlrd simvoldan ~0.85 mlrd
          max_chars: 900000000
          domain_regex: "(xeber|xəbər|xaber|news|press|info|media|qazet|gazet|\\.tv$|tv\\.|sport|radio|post|report|fakt|agentlik|times|journal|jurnal|daily|ekspres|az24|24\\.az)"
          domain_exclude_regex: "forum"
          domains: [publika.az, azadliq.org, amerikaninsesi.org, report.az, metbuat.az, azertag.az,
                    azadliq.az, sizinyol.com, trend.az, yenicag.az, 24saat.org, sia.az, habermonitor.com,
                    turaninfo.az, sumqayitxeber.com, fins.az, musavat.az, musavat.com, milli.az,
                    bizimxeber.az, ekspress.az, aznews.az, movqe.az, teleqraf.com, kaspi.az, sputnik.az,
                    oxu.az, apa.az, qafqazinfo.az, axar.az, modern.az, day.az, 1news.az, haqqin.az,
                    lent.az, azvision.az, yeniavaz.com, unikal.org, xalqcebhesi.az, fed.az, ordu.az,
                    meydan.tv, az.armradio.am, muxalifet.az, banker.az, pia.az, femida.az, baku.ws,
                    salamnews.org, adalet.az, big.az, tia.az, redaktor.az, fanat.az, versus.az,
                    hurriyyet.org, hafta.az, komanda.az, sherg.az, olaylar.az, xural.com, turkustan.info,
                    azedu.az, avtosfer.az, vergiler.az, technote.az, kulis.az, ayna.az, konkret.az,
                    yap.org.az, president.az, yeniazerbaycan.com, novator.az, sfera.az, ikisahil.az,
                    1905.az, editor.az, anl.az, yenigundem.az, ucnoqta.az, trt.net.tr, bbc.com,
                    azerbaycan24.com, minval.info, jam-news.net]
        - label: veb_uzun      # K9: >= 8000 simvol; spamdan sonra ~2 mlrd simvol, təkrarsız
          min_chars: 8000
          max_chars: 2500000000
    # OSCAR çıxarıldı (28 noyabr): URL yoxdur, xəbər payını idarə etmək olmur; FineWeb-2 ilə eyni
    # Common Crawl mənbəyidir və spamdan təmizlənmiş FineWeb-2 həcmi kifayət edir.
train:
  # 27 noyabr Colab T4 ölçüsü (tools/gpu_probe.py, fp16): batch 8 -> 8.4 GiB, 16.4k token/san;
  # batch 12 -> 11.8 GiB, 16.3k; batch 16 yaddaşa sığmır. Sürət batch 8-də platoya çatır.
  batch_size: 8
  grad_accum: 8          # qlobal: 8 x 8 x 1024 = 65 536 token/addım (2 GPU-da hər biri 4 addım)
  lr: 3.0e-4
  warmup: 1000
  schedule: wsd          # sabit sürət, son 20%-də 1-sqrt ilə 10%-ə enmə; pilotda cosine-dan 0.053-0.055 yaxşı (K4)
  decay_frac: 0.2
  min_lr_frac: 0.1
  max_steps: 33500       # 33 500 x 65 536 = ~2.2 milyard token (Chinchilla: 20 token/parametr)
  doc_mask: true         # pilot (results/pilot.md): val loss -0.046/-0.052 iki toxumda, sürət -11% (K3)
  eval_every: 500
  eval_batches: 20
  hub_every: 1000        # checkpoint ~1.3 GB: hər 1000 addımda Hub-a, tarixçə sıxılır (K7)
  spike_rollback: true
  sample_prompt: Qış gecəsi idi
  hub_repo: krmhus/odlar-2
