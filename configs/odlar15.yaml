# Odlar-1.5 (noyabr 2026). 40M parametr, Vikipediya + FineWeb-2.
# Nəticə: val loss 3.353, BPC 1.224, qrammatika 35/40
name: odlar15
model:
  arch: gpt2
  block_size: 512
  n_layer: 10
  n_head: 8
  n_embd: 512
  dropout: 0.1
data:
  vocab_size: 16000
  tok_train_chars: 500000000
  val_frac: 0.02
  sources:
    - type: hf
      label: vikipediya
      path: wikimedia/wikipedia
      name: 20231101.az
      max_chars: 300000000
      min_chars: 200
    - type: hf
      label: fineweb2
      path: HuggingFaceFW/fineweb-2
      name: azj_Latn
      streaming: true
      max_chars: 1200000000
      min_chars: 300
train:
  batch_size: 32
  lr: 5.0e-4
  max_steps: 15000
  eval_every: 500
  sample_prompt: Bakı şəhəri
